name: Quality
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  contract:
    runs-on: [self-hosted, 1msg-ci-heavy]
    container:
      image: node:26.13.1-bookworm@sha256:b7087bc4d973034b30854b378ba107f9fab622b47514cb7e2592e41b8bab8d49
    defaults:
      run:
        shell: bash
    env:
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: safe.directory
      GIT_CONFIG_VALUE_0: '*'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "26.13.1"
      - uses: pnpm/action-setup@v4
        with:
          version: "12.18.0"
          dest: ${{ runner.temp }}/pnpm-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
          run_install: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "24"
      - run: pnpm install --frozen-lockfile --config.dangerously-allow-all-builds=true
      - run: pnpm --dir tools/quality --ignore-workspace install --lockfile-dir "$PWD/quality/tooling" --frozen-lockfile --ignore-scripts --config.engine-strict=false
      - run: pnpm run test:quality
      - run: node tools/quality/run.mjs guards
      - run: pnpm run format:check
      - run: pnpm run lint:static
      - run: pnpm run lint:unused:production
      - run: pnpm run lint:unused:full
      - run: pnpm run lint:duplicates
      - run: pnpm run lint:duplicates:full
      - run: node quality/generator/generate.mjs
      - run: node quality/generator/verify-negative.mjs
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5.11"
          extensions: curl, mbstring
          tools: composer:2.8.12
      - run: composer install --no-interaction --prefer-dist
      - run: find lib -name '*.php' -print0 | xargs -0 -n 1 php -l
      - run: php quality/contract-smoke.php
      - run: git diff --exit-code -- composer.json composer.lock
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quality-evidence
          path: |
            quality/generator/provenance.json
            quality/generator/inventory.json
            quality/reports/
      - name: Return the workspace to the runner user
        if: always()
        run: |
          set -euo pipefail
          runner_root="$(dirname "$(dirname "$GITHUB_WORKSPACE")")"
          owner="$(stat -c '%u:%g' "$runner_root")"
          chown -R "$owner" "$GITHUB_WORKSPACE" || true
          if [ -n "${RUNNER_TEMP:-}" ] && [ -d "$RUNNER_TEMP" ]; then chown -R "$owner" "$RUNNER_TEMP" || true; fi
  quality-required:
    if: always()
    needs: [contract]
    runs-on: [self-hosted, 1msg-ci-heavy]
    steps:
      - env:
          RESULTS: ${{ toJSON(needs) }}
        run: node -e 'const jobs=JSON.parse(process.env.RESULTS); if(!Object.values(jobs).every(job=>job.result==="success")) process.exit(1)'
